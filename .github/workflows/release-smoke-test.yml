name: Release assets and CPU search smoke test

on:
  push:
    branches:
      - feature/phase4-final-system
    paths:
      - '.github/workflows/release-smoke-test.yml'
      - 'scripts/**'
      - 'requirements.txt'
      - 'notebooks/17_phase4d_live_demo.ipynb'
  workflow_dispatch:

jobs:
  verify-public-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install search dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=2.0,<2.3" "scikit-learn>=1.6,<2" "joblib>=1.4,<2" "threadpoolctl>=3.5,<4"
      - name: Download exact public Release files
        run: python scripts/download_release_assets.py --root ./HP-SS-Engine
      - name: Verify SHA-256 digests
        run: python scripts/download_release_assets.py --root ./HP-SS-Engine --verify-only
      - name: Validate corpus, model and index
        run: python scripts/preflight_assets.py --root ./HP-SS-Engine
      - name: Exercise real CPU Top-10 search
        run: python scripts/smoke_test_search.py --root ./HP-SS-Engine
      - name: Validate live-demo notebook JSON and Python syntax
        run: |
          python - <<'PY'
          import ast, json, pathlib
          p=pathlib.Path('notebooks/17_phase4d_live_demo.ipynb')
          nb=json.loads(p.read_text(encoding='utf-8'))
          assert nb['nbformat']==4
          assert all('drive.mount' not in ''.join(c['source']) for c in nb['cells'] if c['cell_type']=='code')
          for i,c in enumerate(nb['cells']):
              if c['cell_type']!='code': continue
              source=''.join(c['source'])
              code='\n'.join('pass  # Colab magic' if line.lstrip().startswith('%') else line for line in source.splitlines())
              ast.parse(code,filename=f'cell_{i}')
          print('PASS: Colab demo code cells parse and do not require Google Drive')
          PY
